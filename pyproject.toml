[project]
name = "anime-gif-node-studio"
version = "0.0.0"
description = "PySide6/NodeGraphQt node-based anime GIF editor"
authors = [
    { name = "mwtjc", email = "mwtjc@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "av>=18.0.0",
    "loguru>=0.7.3",
    "looseversion>=1.3.0",
    "nodegraphqt>=0.6.44",
    "nuitka>=4.1.3",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "platformdirs>=4.11.0",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
    "wand>=0.7.2",
]

# 非包项目（virtual project）：uv 只同步依赖，不把本项目构建/安装为 wheel。
# 因此没有 console script，运行需 PYTHONPATH=src（见 README「运行」）。
[tool.uv]
package = false

# pytest 需要它来找 src 布局下的包（与打包无关，勿删）
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # 色板分析/生成脚本（scripts/palette_proposals.py 等）用；运行时不需要——
    # OKLCH_ANCHORS 为预生成写死 hex，避免 Nuitka 打包体积。
    "coloraide>=8.12.1",
]
